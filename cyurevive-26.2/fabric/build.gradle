plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = "cyurevive-${minecraft_version}-fabric"
}

loom {
    mods {
        cyurevive {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    implementation "com.electronwill.night-config:core:3.9.0"
    implementation "com.electronwill.night-config:toml:3.9.0"
    include "com.electronwill.night-config:core:3.9.0"
    include "com.electronwill.night-config:toml:3.9.0"
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

sourceSets {
    main {
        java.srcDir '../src/main/java'
        resources.srcDir '../src/main/resources'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

test { enabled = false }
